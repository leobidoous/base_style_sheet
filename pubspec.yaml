name: base_style_sheet
description: Um package auxiliar para manter os componentes visuais globais de um aplicativo multi-repositório e mono-repositório.
homepage: https://www.github.com/leobidoous
repository: https://www.github.com/leobidoous/base_style_sheet
issue_tracker: https://www.github.com/leobidoous/base_style_sheet/issues
version: 1.6.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  pinput: ^6.0.2
  shimmer: ^4.0.0
  flutter_svg: ^2.3.0
  file_picker: ^13.1.0
  photo_view: ^0.15.0
  fluttertoast: ^10.0.2
  image_picker: ^1.2.4
  auto_size_text: ^3.0.0
  webview_flutter: ^4.14.1
  flutter_cache_manager: ^3.4.5
  cached_network_image: ^4.0.4
  webview_flutter_web: ^0.2.3+4
  webview_flutter_android: ^4.13.0
  custom_refresh_indicator: ^4.0.2
  webview_flutter_wkwebview: ^3.27.0
  syncfusion_flutter_pdfviewer: ^35.1.39
  cached_network_image_platform_interface: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
